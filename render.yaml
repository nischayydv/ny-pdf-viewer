services:
  - type: web
    name: secure-pdf-share
    runtime: node
    plan: starter            # persistent disks need a paid instance
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false          # you enter this in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: pdf-data
      mountPath: /var/data
      sizeGB: 5
